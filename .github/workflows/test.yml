name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node "$CLI" workspace init --name ci-workspace --no-open && test -f ci-workspace/.mcp.json
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          CLI: ${{ github.workspace }}/bin/cli.js
